<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe.js — Настенный термостат</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <vibe-app id="app">
    <template>
      <div class="smart-screen">
        <h2>Гостиная</h2>

        <p class="temp">Текущая температура: <strong>{{ sensor.temperature }}°C</strong></p>
        <p class="hum">Влажность: {{ sensor.humidity }}%</p>

        <vibe-chart v-bind:data="sensor.history"></vibe-chart>

        <div class="controls">
          <vibe-toggle v-model="isOn" label="Кондиционер"></vibe-toggle>
          <vibe-dimmer v-model="brightness"></vibe-dimmer>
        </div>

        <button class="btn" v-on:click="toggleConditioner">
          {{ isOn ? 'Выключить кондей' : 'Включить кондей' }}
        </button>
      </div>
    </template>
  </vibe-app>

  <script type="module" src="./main.js"></script>
</body>
</html>
